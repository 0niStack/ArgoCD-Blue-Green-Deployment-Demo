apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-green
spec:
  replicas: 2
  selector:
    matchLabels: {app: demo, color: green}
  template:
    metadata:
      labels: {app: demo, color: green}
    spec:
      containers:
        - name: apache
          image: httpd:2.4-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
          volumeMounts:
            - {name: html, mountPath: /usr/local/apache2/htdocs}
      volumes:
        - name: html
          configMap: {name: green-html}
