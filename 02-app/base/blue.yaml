apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-blue
spec:
  replicas: 2
  selector:
    matchLabels: {app: demo, color: blue}
  template:
    metadata:
      labels: {app: demo, color: blue}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
          volumeMounts:
            - {name: html, mountPath: /usr/share/nginx/html}
      volumes:
        - name: html
          configMap: {name: blue-html}
